name: 'a11y-toolkit audit'
description: >
  Audit URLs with the a11y-toolkit engine (beyond-axe signals, honest 0-100
  score): step-summary report, SARIF artifact, and one GitHub issue per
  finding group — reopened on regression, closed when resolved, frozen by
  the wontfix label. Automated screening is a filter, not conformance.
branding:
  icon: 'eye'
  color: 'orange'
inputs:
  urls:
    description: 'Newline-delimited list of URLs to audit (public pages; the engine fetches server-side).'
    required: true
  token:
    description: 'Token for issue operations (needs issues:write).'
    required: false
    default: ${{ github.token }}
  create-issues:
    description: 'File/update one issue per signal+URL. true | false'
    required: false
    default: 'true'
  labels:
    description: 'Comma-separated labels for the issues the action owns.'
    required: false
    default: 'a11y-toolkit'
  fail-on:
    description: 'Exit 1 when findings of at least this severity exist. none | medium | high'
    required: false
    default: 'none'
  lang:
    description: 'Report language. en | es'
    required: false
    default: 'en'
outputs:
  min-score:
    description: 'Lowest score across the audited URLs.'
    value: ${{ steps.audit.outputs.min-score }}
  findings:
    description: 'Total findings across the audited URLs.'
    value: ${{ steps.audit.outputs.findings }}
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install a11y-toolkit (pinned release)
      run: pip install --quiet "a11y-toolkit==5.26.0"
      shell: bash
    - name: Audit + report + issues
      id: audit
      env:
        INPUT_URLS: ${{ inputs.urls }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_CREATE_ISSUES: ${{ inputs.create-issues }}
        INPUT_LABELS: ${{ inputs.labels }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_LANG: ${{ inputs.lang }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GH_TOKEN: ${{ inputs.token }}
      run: python3 "${{ github.action_path }}/entry.py"
      shell: bash
    - name: Upload full report
      uses: actions/upload-artifact@v4
      with:
        name: a11y-toolkit-report
        path: a11y-report/
        retention-days: 30
