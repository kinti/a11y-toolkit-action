name: CI
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python3 test_entry.py
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: pip install --quiet "a11y-toolkit==5.27.0"
      - name: 'Audit the toolkit own site (dry run, no issues filed)'
        env:
          INPUT_URLS: https://a11y.es
          INPUT_CREATE_ISSUES: 'false'
          INPUT_FAIL_ON: 'none'
          INPUT_LANG: 'en'
        run: python3 entry.py --dry-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: a11y-report, path: a11y-report/}
